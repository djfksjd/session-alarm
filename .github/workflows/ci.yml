name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Compile Python sources
        run: python -m compileall -q plugins/session-alarm

      - name: Run unit tests
        env:
          SESSION_ALARM_DISABLE_AUDIO: "1"
          SESSION_ALARM_DISABLE_NOTIFICATIONS: "1"
        run: python -m unittest discover -s tests -v

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(path)
          PY

  portability:
    name: portability-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Run unit tests
        env:
          SESSION_ALARM_DISABLE_AUDIO: "1"
          SESSION_ALARM_DISABLE_NOTIFICATIONS: "1"
        run: python -m unittest discover -s tests -v
